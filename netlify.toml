# Statische App ohne Build-Schritt: Netlify veröffentlicht den Ordner so, wie er ist.
# Der Befehl muss hier stehen (nicht leer), sonst nimmt Netlify den alten
# Build-Befehl aus den Projekt-Einstellungen.
[build]
  publish = "."
  command = "echo 'Kein Build nötig: statische App'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
