<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c7a60">
<meta name="description" content="KidsWörtli – Französisch- und Englisch-Wortschatz üben">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidsWörtli">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>KidsWörtli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700&display=swap">
<style>
/* Layout: one narrow column like a school sheet; Fixpunkt strip on top, tabbed practice modes below */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --ink:#22302a; --muted:#5d6a63; --line:#d8ded5;
  --sage:#4c7a60; --sage-soft:#e2ece4; --rose:#9f5f73; --rose-soft:#f3e5ea;
  --ok:#2c7a4c; --ok-soft:#dcefe2; --nok:#b0453a; --nok-soft:#f7e1dd; --warn:#94620d; --warn-soft:#f8ecd3;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1d2521; --ink:#e6ece8; --muted:#9ba69f; --line:#303b35;
  --sage:#87b99b; --sage-soft:#22312a; --rose:#d69aad; --rose-soft:#3a2830;
  --ok:#72c793; --ok-soft:#1f3527; --nok:#ee8b7e; --nok-soft:#3d2421; --warn:#e0b45e; --warn-soft:#3a2e17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2521; --ink:#e6ece8; --muted:#9ba69f; --line:#303b35;
  --sage:#87b99b; --sage-soft:#22312a; --rose:#d69aad; --rose-soft:#3a2830;
  --ok:#72c793; --ok-soft:#1f3527; --nok:#ee8b7e; --nok-soft:#3d2421; --warn:#e0b45e; --warn-soft:#3a2e17; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}

header{display:flex;flex-direction:column;gap:4px}
header p{margin:0;color:var(--muted)}

/* Fixpunkt */
.fix{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fix-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.days{font-family:var(--f-display);font-size:2.6rem;font-weight:700;color:var(--rose);line-height:1;font-variant-numeric:tabular-nums}
.fix-top div{min-width:0}
.steps{display:flex;flex-wrap:wrap;gap:5px}
.steps span{width:14px;height:14px;border-radius:50%;background:var(--rose-soft);border:1px solid var(--line)}
.steps span.goal{background:var(--rose);border-color:var(--rose);border-radius:3px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:4.5rem 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-nok{background:var(--nok)}
.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.plan{margin:0;font-size:.95rem}

/* Tabs */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--sage-soft);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.panel{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:.9rem;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft);color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 10px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sage-soft);color:var(--ink)}
.fp-seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%}
.lang-seg button{padding:10px 6px;font-size:1rem}
.lang-seg button[aria-pressed="true"]{background:var(--sage);color:var(--surface)}
.chip-mark[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.mk{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ok-soft);color:var(--ok);margin-left:6px;vertical-align:middle}
.ex{font-size:.92rem;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.pair .ex{grid-column:1/-1;margin-top:-4px}
.pair.marked{box-shadow:inset 4px 0 0 var(--ok)}
.fp-seg button{padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.fp-seg small{font-weight:400}
.dir-block{display:flex;flex-direction:column;gap:6px}
.dir{display:flex;flex-direction:column;gap:6px}
.dir button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.dir button small{color:var(--muted);font-size:.82rem}
.dir button[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft);box-shadow:inset 4px 0 0 var(--sage)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sage);color:var(--surface)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.nok{background:var(--nok);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--rose-soft);color:var(--rose)}
.say-line{display:flex;align-items:flex-start;gap:10px}
.say-line > div{min-width:0;flex:1}
.q{font-family:var(--f-display);font-size:1.7rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.a{font-size:1.25rem;font-weight:700;color:var(--sage);overflow-wrap:anywhere}
.speak{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.speak svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.divider{height:1px;background:var(--line)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sage);transition:width .25s}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:12px;padding:12px;background:var(--ok-soft)}
.stat.n{background:var(--nok-soft)}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}

/* Gap */
.gap-sentence{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.gap-input{font:inherit;font-family:var(--f-body);font-size:1.1rem;padding:4px 8px;border:0;border-bottom:2.5px solid var(--sage);background:var(--sage-soft);color:var(--ink);border-radius:6px 6px 0 0;width:9.5em;max-width:100%}
.feedback{padding:10px 12px;border-radius:10px;font-weight:700}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.nok{background:var(--nok-soft);color:var(--nok)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}

/* Genus */
.genus-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.genus-btns button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}
.genus-btns small{font-weight:400;color:var(--muted)}
.genus-btns button.right{border-color:var(--ok);background:var(--ok-soft)}
.genus-btns button.wrong{border-color:var(--nok);background:var(--nok-soft)}

/* Sheet */
.note{background:var(--sage-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.note ul{margin:6px 0 0;padding-left:18px}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pack-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--rose-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:.95rem}
.pair > div{min-width:0;overflow-wrap:anywhere}
.pair.flag{background:var(--warn-soft)}
.fixbox{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.fixbox s{color:var(--nok)}
.fixbox ins{text-decoration:none;color:var(--ok);font-weight:700}
.fixbox .seg button{font-size:.8rem}
.write-in{width:100%;font:inherit;font-size:1.15rem;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:3.2em}
.write-in:focus{border-color:var(--sage);outline:none}
.write-in:disabled{opacity:.8}
.yours{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.yours s{color:var(--nok)}
.score{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}
.score span{padding:4px 10px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.score .s-ok{background:var(--ok-soft);color:var(--ok)}
.score .s-nok{background:var(--nok-soft);color:var(--nok)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--sage);display:grid;place-items:center;margin:4px auto 0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.mic svg{width:34px;height:34px;fill:none;stroke:var(--surface);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.listening{background:var(--nok);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(176,69,58,.45)}50%{box-shadow:0 0 0 14px rgba(176,69,58,0)}}
.mic-hint{text-align:center;font-size:.9rem;color:var(--muted)}
.heard{font-size:.95rem;overflow-wrap:anywhere}
.heard small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.bar-sep{height:1px;background:var(--line);margin:2px 0}
.g-badge{font-size:.72rem;font-weight:700;color:var(--rose);margin-left:4px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px)}
/* Profile */
.profiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.profiles .chip{padding:5px 12px}
.add-chip{border-style:dashed}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.welcome p{margin:0}
.name-form{display:flex;gap:8px;flex-wrap:wrap}
.name-form input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:.85rem}
footer{font-size:.85rem;color:var(--muted);text-align:center;font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="subject">KidsWörtli · Französisch</span>
    <h1 id="title">Päckli</h1>
    <div class="profiles" id="profiles" aria-label="Wer übt?"></div>
  </header>

  <section class="welcome" id="welcome" hidden>
    <h2>Wer übt?</h2>
    <p class="muted">Gib deinen Namen ein. Jedes Kind bekommt seinen eigenen Lernstand auf diesem Gerät.</p>
    <form class="name-form" id="nameForm">
      <input id="nameInput" maxlength="20" autocomplete="off" placeholder="Name" aria-label="Name">
      <button class="btn" type="submit">Los geht's</button>
    </form>
    <button class="linkbtn" type="button" id="cancelAdd" hidden>Abbrechen</button>
  </section>

  <div id="app" class="panel" style="gap:18px">
  <div class="seg fp-seg lang-seg" id="langSeg" role="group" aria-label="Fach wählen">
    <button data-lang="fr" aria-pressed="true"><b>Französisch</b></button>
    <button data-lang="en" aria-pressed="false"><b>Englisch</b></button>
  </div>
  <div class="seg fp-seg" id="fpSeg" role="group" aria-label="Fixpunkt wählen"></div>
  <section class="fix" aria-labelledby="fixh">
    <div class="fix-top">
      <span class="days" id="days">–</span>
      <div>
        <h2 id="fixh">Tage bis Fixpunkt</h2>
        <span class="muted" id="fixdate"></span>
      </div>
    </div>
    <div class="steps" id="steps" aria-hidden="true"></div>
    <div class="bars" id="bars"></div>
    <p class="plan" id="plan"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-cards" aria-selected="true" data-tab="cards">Karten</button>
    <button role="tab" id="t-gaps" aria-selected="false" data-tab="gaps">Lücken</button>
    <button role="tab" id="t-genus" aria-selected="false" data-tab="genus">m / f</button>
    <button role="tab" id="t-sheet" aria-selected="false" data-tab="sheet">Blatt</button>
  </nav>

  <!-- Karteikarten -->
  <section class="panel" id="p-cards" role="tabpanel">
    <div id="setup" class="panel">
      <div class="row" id="packChips"></div>
      <div class="dir-block">
        <span class="eyebrow" id="dirLabel">Abfragerichtung</span>
        <div class="dir" id="dirSeg" role="group" aria-labelledby="dirLabel">
          <button data-dir="fd" aria-pressed="false"><b>Nur Französisch → Deutsch</b><small>Du siehst Französisch und sagst Deutsch</small></button>
          <button data-dir="df" aria-pressed="false"><b>Nur Deutsch → Französisch</b><small>Du siehst Deutsch und sagst Französisch</small></button>
          <button data-dir="mix" aria-pressed="true"><b>Gemischt</b><small>Beide Richtungen zufällig</small></button>
        </div>
      </div>
      <div class="dir-block">
        <span class="eyebrow" id="modeLabel">Abfrageart</span>
        <div class="dir" id="modeSeg" role="group" aria-labelledby="modeLabel">
          <button data-mode="flip" aria-pressed="true"><b>Aufdecken</b><small>Im Kopf übersetzen, Lösung zeigen, selbst bewerten</small></button>
          <button data-mode="write" aria-pressed="false"><b>Schreiben</b><small>Ganze Wörter und Sätze eintippen, die App prüft</small></button>
          <button data-mode="speak" aria-pressed="false" hidden><b>Sprechen <span class="mk" style="margin-left:4px">Test · nur Admin</span></b><small>Antwort laut sagen, die App hört zu und prüft</small></button>
        </div>
      </div>
      <div class="row">
        <button class="chip chip-mark" id="onlyMarked" aria-pressed="false" hidden>Nur grün markierte</button>
        <button class="chip" id="onlyNok" aria-pressed="false">Nur nicht gewusste</button>
      </div>
      <button class="btn" id="start">Runde starten</button>
      <p class="muted" id="setupInfo" style="margin:0;font-size:.9rem"></p>
    </div>
    <div id="play" class="panel" hidden></div>
  </section>

  <!-- Lücken -->
  <section class="panel" id="p-gaps" role="tabpanel" hidden></section>

  <!-- Genus -->
  <section class="panel" id="p-genus" role="tabpanel" hidden></section>

  <!-- Blatt -->
  <section class="panel" id="p-sheet" role="tabpanel" hidden></section>
  </div>

  <footer>Jeder Schritt vorwärts zählt, egal wie klein er ist.</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Jeder Fixpunkt fasst zwei Päckli zusammen. Neue Päckli: hier einen Fixpunkt
   ergänzen und unten Karten, Lücken und Genus-Wörter mit dem Päckli-Kürzel. */
const FIXPUNKTE = [
  {id:"fp3", lang:"fr", name:"Fixpunkt 3", date:new Date(2026, 9, 20), packs:["3A","3B"],
   sheet:["Foto war um 90° gedreht und wurde ausgerichtet.",
          "Titel, Spaltenköpfe und der Spruch unten wurden nicht als Vokabeln übernommen.",
          "3 Stellen sehen nach Tippfehlern auf dem Blatt aus. Du entscheidest, was gelernt wird."]},
  {id:"fp4", lang:"fr", name:"Fixpunkt 4", date:new Date(2026, 10, 3), packs:["4A","4B"],
   sheet:["Foto war um 90° gedreht und wurde ausgerichtet.",
          "Titel, Spaltenköpfe und der Spruch unten wurden nicht als Vokabeln übernommen.",
          "Keine Tippfehler auf dem Blatt gefunden."]},
  {id:"en1", lang:"en", name:"Unit 1", title:"Unit 1 – Getting together", date:null, packs:["E1","E2","E3","E4","E5"],
   sheet:["Die Beispielsätze wurden übernommen; sie erscheinen bei der Lösung und im Lückentext.",
          "Grün markierte Wörter sind mit «grün» gekennzeichnet und lassen sich separat üben.",
          "Die Französisch-Spalte im Buch wurde weggelassen."]}
];
/* Päckli bzw. Abschnitte: Kurzname, voller Name, Zusatz */
const PACKS = {
  "3A":{short:"3A", title:"Päckli 3A", sub:"KW 37"}, "3B":{short:"3B", title:"Päckli 3B", sub:"KW 38"},
  "4A":{short:"4A", title:"Päckli 4A", sub:"KW 43"}, "4B":{short:"4B", title:"Päckli 4B", sub:"KW 44"},
  "E1":{short:"Teil 1", title:"Teil 1", sub:"Familie"},
  "E2":{short:"Teil 2", title:"Teil 2", sub:"Fragen, Eltern, Sprachen"},
  "E3":{short:"Teil 3", title:"Teil 3", sub:"Hobbys"},
  "E4":{short:"Teil 4", title:"Teil 4", sub:"Wochentage"},
  "E5":{short:"Teil 5", title:"Teil 5", sub:"Tageszeit"}
};
const LANGS = {
  fr:{name:"Französisch", code:"fr-FR", ph:"En français …", acc:["à","â","ç","é","è","ê","ë","î","ï","ô","ù","û","œ"]},
  en:{name:"Englisch", code:"en-GB", ph:"In English …", acc:[]}
};

const CARDS = [
  {id:"a1",p:"3A",fr:"Ça dure…",de:"Es dauert…"},
  {id:"a2",p:"3A",fr:"Il y a…",de:"Es hat…"},
  {id:"a3",p:"3A",fr:"Ça dure quelques minutes/secondes.",de:"Es dauert einige Minuten/Sekunden."},
  {id:"a4",p:"3A",fr:"Il y a beaucoup de chevaux.",de:"Es hat viele Pferde."},
  {id:"a5",p:"3A",fr:"des garçons",de:"Jungen",g:"m"},
  {id:"a6",p:"3A",fr:"des filles",de:"Mädchen",g:"f"},
  {id:"a7",p:"3A",fr:"des enfants",de:"Kinder",g:"m/f"},
  {id:"a8",p:"3A",fr:"beaucoup de personnes",de:"viele Leute"},
  {id:"b1",p:"3B",fr:"On peut…",de:"Man kann…"},
  {id:"b2",p:"3B",fr:"Je trouve ça…",de:"Ich finde das…"},
  {id:"b3",p:"3B",fr:"On peut voir un spectacle.",de:"Man kann eine Vorstellung sehen."},
  {id:"b4",p:"3B",fr:"Je trouve ça magnifique.",de:"Ich finde das wunderschön."},
  {id:"b5",p:"3B",fr:"extraordinaire",de:"aussergewöhnlich"},
  {id:"b6",p:"3B",fr:"impressionnant",de:"beeindruckend"},

  {id:"c1",p:"4A",fr:"Il s'agit d'…",de:"Es handelt sich um…"},

const $ = s => document.querySelector(s);

const speakIcon = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function speakBtn(txt, lang){ return `<button class="speak" data-say="${esc(txt)}" data-lang="${lang}" aria-label="Vorlesen">${speakIcon}</button>`; }

function say(txt, lang){
  try {
    if (!("speechSynthesis" in window)) throw 0;
    const orWord = {fr:" ou ", en:" or "}[lang.slice(0,2)] || " oder ";
    const u = new SpeechSynthesisUtterance(txt.replace(/…/g,"").replace(/\//g, orWord).replace(/\(.*?\)/g,""));
    u.lang = lang; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2)));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){ toast("Vorlesen wird auf diesem Gerät nicht unterstützt."); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) say(b.dataset.say, b.dataset.lang);
});

const norm = s => s.trim().toLowerCase().replace(/\s+/g," ").replace(/[’']/g,"'");

/* ---------- Fixpunkt ---------- */
function renderFix(){
  const today = new Date(); today.setHours(0,0,0,0);
  const dated = !!FP.date;
  const days = dated ? Math.round((FP.date - today) / 864e5) : 0;
  $("#subject").textContent = "KidsWörtli · " + L().name;
  document.querySelectorAll("#langSeg [data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === FP.lang));
  $("#days").hidden = !dated; $("#steps").hidden = !dated;
  if (dated){
    $("#days").textContent = days >= 0 ? days : "0";
    $("#fixh").textContent = days > 0 ? (days === 1 ? `Tag bis ${FP.name}` : `Tage bis ${FP.name}`) : (days === 0 ? `Heute ist ${FP.name}` : `${FP.name} ist vorbei`);
    $("#fixdate").textContent = FP.date.toLocaleDateString("de-CH", {weekday:"long", day:"2-digit", month:"2-digit", year:"numeric"});
    $("#title").innerHTML = "Päckli " + FP.packs.map(esc).join(" &amp; ");
  } else {
    $("#fixh").textContent = FP.title || FP.name;
    $("#fixdate").textContent = "Class vocabulary · ohne Prüfungsdatum";
    $("#title").textContent = FP.title || FP.name;
  }
  const fps = FIXPUNKTE.filter(f => f.lang === FP.lang);
  $("#fpSeg").hidden = fps.length < 2;
  $("#fpSeg").innerHTML = fps.map(f => `<button data-fp="${f.id}" aria-pressed="${f===FP}"><b>${esc(f.name)}</b><small>${f.packs.map(x => PK(x).short).join(" · ")}${f.date ? " · " + f.date.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"}) : ""}</small></button>`).join("");
  document.querySelectorAll("[data-fp]").forEach(b => b.onclick = () => setFp(b.dataset.fp));
  $("#t-genus").hidden = !GENUS.some(inFp);
  const n = Math.max(0, Math.min(days, 40));
  $("#steps").innerHTML = Array.from({length:n}, (_,i) => `<span class="${i===n-1?'goal':''}"></span>`).join("");

  $("#bars").innerHTML = FP.packs.map(p => {
    const cs = CARDS.filter(c => c.p === p);
    const ok = cs.filter(c => status(c.id)==="ok").length;
    const nok = cs.filter(c => status(c.id)==="nok").length;
    return `<div class="bar-row"><span><b>${esc(PK(p).short)}</b> <span class="muted">${dated ? esc(PK(p).sub) : ""}</span></span>
      <div class="bar" role="img" aria-label="${ok} gewusst, ${nok} nicht gewusst von ${cs.length}">
        <i class="b-ok" style="width:${ok/cs.length*100}%"></i><i class="b-nok" style="width:${nok/cs.length*100}%"></i></div>
      <span class="num">${ok}/${cs.length}</span></div>`;
  }).join("") + '<div class="bar-sep"></div>' + [
    ...(CARDS.some(c => inFp(c) && c.m) ? [["Grün", CARDS.filter(c => inFp(c) && c.m).map(c => S.status[c.id])]] : []),
    ["Lücken", fpGapIdx().map(i => S.gaps[i])],
    ["m / f", GENUS.filter(inFp).map(x => S.genus[x.w])]
  ].filter(([, res]) => res.length).map(([label, res]) => {
    const ok = res.filter(r => r==="ok").length, nok = res.filter(r => r==="nok").length, n = res.length;
    return `<div class="bar-row"><span><b>${label}</b></span>
      <div class="bar" role="img" aria-label="${ok} richtig, ${nok} falsch von ${n}">
        <i class="b-ok" style="width:${ok/n*100}%"></i><i class="b-nok" style="width:${nok/n*100}%"></i></div>
      <span class="num">${ok}/${n}</span></div>`;
  }).join("");

  const fpCards = CARDS.filter(inFp);
  const open = fpCards.filter(c => status(c.id) !== "ok").length;
  const nok = fpCards.filter(c => status(c.id) === "nok").length;
  let plan;
  if (open === 0) plan = dated ? "Alle Karten sitzen. Bis zum Fixpunkt reicht eine kurze Runde alle zwei Tage zum Wiederholen." : "Alle Karten sitzen. Eine kurze Runde alle paar Tage hält sie frisch.";
  else if (!dated) plan = `Noch <b>${open}</b> Karten offen${nok ? `, davon ${nok} nicht gewusst` : ""}.`;
  else if (days <= 0) plan = `Noch ${open} Karten offen. Heute nochmals alle durchgehen.`;
  else {
    const perDay = Math.ceil(open / Math.max(1, days - 1));
    plan = `Noch <b>${open}</b> Karten offen${nok ? `, davon ${nok} nicht gewusst` : ""}. Mit <b>${perDay} Karte${perDay>1?"n":""} pro Tag</b> bist du einen Tag vor dem Fixpunkt fertig.`;
  }
  $("#plan").innerHTML = plan;
}

  mode: S.mode==="write" ? "write" : (S.mode==="speak" && speakAllowed()) ? "speak" : "flip", onlyNok:false, onlyMarked:false});
let sel = newSel();
let round = null;

/* Antwort beim Schreiben prüfen: Gross/Klein, Satzzeichen, «…» und Leerzeichen
   spielen keine Rolle. Bei «a/b» zählt a, b oder beides. */
function cleanAns(s){
  return s.normalize("NFC").toLowerCase()
    .replace(/[’`´]/g,"'").replace(/\.\.\.|…/g," ")
    .replace(/[.,!?;:«»"]/g," ").replace(/\s*'\s*/g,"'")
    .replace(/\s+/g," ").trim();
}
function variants(t){
  // «A / B» = zwei gleichwertige Antworten; «a/b» innerhalb eines Satzes = a, b oder beides
  const out = [t];
  if (t.includes(" / ")) out.push(...t.split(" / "));
  out.slice().forEach(x => {
    const m = x.match(/(\S+)\/(\S+)/);
    if (m) out.push(x.replace(m[0], m[1]), x.replace(m[0], m[2]));
  });
  // deutscher Artikel darf fehlen: «Name» statt «der Name»
  out.slice().forEach(x => { const m = x.match(/^(der|die|das) (.+)$/i); if (m) out.push(m[2]); });
  return out;
}
const stripAcc = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function checkWritten(input, target){
  const a = cleanAns(input), opts = variants(target).map(cleanAns);
  if (opts.includes(a)) return "ok";
  if (opts.map(stripAcc).includes(stripAcc(a))) return "almost";
  return "nok";
}

function pool(){
  return CARDS.filter(c => sel.packs.has(c.p) && (!sel.onlyNok || status(c.id)==="nok") && (!sel.onlyMarked || c.m));
}
function renderSetup(){
  $("#packChips").innerHTML = FP.packs.map(p =>
    `<button class="chip" data-pack="${p}" aria-pressed="${sel.packs.has(p)}">${esc(PK(p).title)} · ${esc(PK(p).sub)}</button>`).join("");
  document.querySelectorAll("[data-pack]").forEach(b => b.onclick = () => {
    sel.packs.has(b.dataset.pack) ? sel.packs.delete(b.dataset.pack) : sel.packs.add(b.dataset.pack);
    renderSetup();
  });
  $("#onlyNok").setAttribute("aria-pressed", sel.onlyNok);
  const markedN = CARDS.filter(c => inFp(c) && c.m).length;
  $("#onlyMarked").hidden = !markedN;
  $("#onlyMarked").textContent = `Nur grün markierte (${markedN})`;
  $("#onlyMarked").setAttribute("aria-pressed", sel.onlyMarked);
  const ln = L().name;
  const dirTxt = {fd:[`Nur ${ln} → Deutsch`, `Du siehst ${ln} und sagst Deutsch`], df:[`Nur Deutsch → ${ln}`, `Du siehst Deutsch und sagst ${ln}`]};
  document.querySelectorAll("#dirSeg button").forEach(b => { const t = dirTxt[b.dataset.dir]; if (t){ b.querySelector("b").textContent = t[0]; b.querySelector("small").textContent = t[1]; } });
  document.querySelectorAll("#dirSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.dir===sel.dir));
  $('#modeSeg [data-mode="speak"]').hidden = !speakAllowed();
  if (sel.mode === "speak" && !speakAllowed()) sel.mode = "flip";
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode===sel.mode));
  const n = pool().length;
  const nokCount = CARDS.filter(c => inFp(c) && status(c.id)==="nok").length;
  $("#start").disabled = n === 0;
  $("#setupInfo").textContent = n === 0
    ? (sel.onlyNok ? "Keine nicht gewussten Karten in dieser Auswahl. Super!" : sel.onlyMarked ? "In dieser Auswahl gibt es keine grün markierten Karten." : "Wähle mindestens ein Päckli.")
    : `${n} Karten ausgewählt${sel.onlyMarked ? " (nur grün markierte)" : ""}, ${({fd:`nur ${ln} → Deutsch`,df:`nur Deutsch → ${ln}`,mix:"gemischt"})[sel.dir]}. Nicht gewusste kommen etwa 1,5-mal so oft dran${nokCount ? ` (aktuell ${nokCount})` : ""}.`;
}
$("#onlyNok").onclick = () => { sel.onlyNok = !sel.onlyNok; renderSetup(); };
$("#onlyMarked").onclick = () => { sel.onlyMarked = !sel.onlyMarked; renderSetup(); };
document.querySelectorAll("#dirSeg button").forEach(b => b.onclick = () => { sel.dir = b.dataset.dir; S.dir = sel.dir; save(); renderSetup(); });
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => { sel.mode = b.dataset.mode; S.mode = sel.mode; save(); renderSetup(); });

$("#start").onclick = () => {
  const deck = [];
  pool().forEach(c => {
    deck.push(c);
    if (status(c.id)==="nok" && Math.random() < .5) deck.push(c); // Faktor 1,5
  });
  shuffle(deck);
  for (let i=1;i<deck.length;i++) if (deck[i]===deck[i-1]) { const j=(i+1)%deck.length; [deck[i],deck[j]]=[deck[j],deck[i]]; }
  round = {deck: deck.map(c => ({c, dir: sel.dir==="mix" ? (Math.random()<.5?"fd":"df") : sel.dir})), i:0, shown:false, res:{}, mode: sel.mode, typed:"", verdict:null};
  $("#setup").hidden = true; $("#play").hidden = false;
  renderCard();
};

function renderCard(){
  const P = $("#play");
  if (round.i >= round.deck.length) return renderSummary();
  const {c, dir} = round.deck[round.i];
  const fr = text(c,"fr"), de = text(c,"de");
  const q = dir==="fd" ? fr : de, a = dir==="fd" ? de : fr;
  const ql = dir==="fd" ? L().code : "de-CH", al = dir==="fd" ? "de-CH" : L().code;
  const st = status(c.id);
  if (round.mode === "write") return renderWriteCard(c, dir, q, a, ql, al, st);
  if (round.mode === "speak") return renderSpeakCard(c, dir, q, a, ql, al, st);
  P.innerHTML = `
    <div class="progress" aria-hidden="true"><i style="width:${round.i/round.deck.length*100}%"></i></div>
    <div class="card">
      <div class="card-head">
        <span class="eyebrow">${dir==="fd" ? `${L().name} → Deutsch` : `Deutsch → ${L().name}`}</span>
        <span class="tag">${esc(PK(c.p).short)}${st==="nok" ? " · üben" : ""}</span>
      </div>
      <div class="say-line"><div class="q">${esc(q)}${c.g && dir==="fd" ? `<span class="g-badge">(${c.g})</span>` : ""}</div>${speakBtn(q, ql)}</div>
      ${round.shown ? `<div class="divider"></div>
      <div class="say-line"><div class="a">${esc(a)}${c.g && dir==="df" ? `<span class="g-badge">(${c.g})</span>` : ""}${c.m ? '<span class="mk">grün</span>' : ""}</div>${speakBtn(a, al)}</div>
      ${c.ex ? `<div class="say-line"><div class="ex">${esc(c.ex)}</div>${speakBtn(c.ex, L().code)}</div>` : ""}` : ""}
    </div>
    ${round.shown
      ? `<div class="btns"><button class="btn nok" id="nok">Nicht gewusst</button><button class="btn ok" id="ok">Gewusst</button></div>`
      : `<button class="btn" id="show">Lösung zeigen</button>`}
    <div class="row" style="justify-content:space-between">
      <span class="num">${round.i+1} / ${round.deck.length}</span>
      <button class="btn ghost" id="stop" style="padding:8px 14px">Runde beenden</button>
    </div>`;
  if (round.shown){
    $("#ok").onclick = () => answer("ok");
    $("#nok").onclick = () => answer("nok");
    $("#ok").focus();
  } else {
    $("#show").onclick = () => { round.shown = true; renderCard(); };
    $("#show").focus();
  }
  $("#stop").onclick = () => { round.deck = round.deck.slice(0, round.i); renderSummary(); };
}
function renderWriteCard(c, dir, q, a, ql, al, st){
  const P = $("#play");
  const v = round.verdict;
  const fb = !v ? "" : v === "ok"
    ? `<div class="feedback ok">Richtig!</div>`
    : v === "almost"
      ? `<div class="feedback warn">Fast! Achte auf die Akzente.</div>`
      : `<div class="feedback nok">Leider nicht ganz.</div>`;
  P.innerHTML = `
    <div class="progress" aria-hidden="true"><i style="width:${round.i/round.deck.length*100}%"></i></div>
    <div class="card">
      <div class="card-head">
        <span class="eyebrow">${dir==="fd" ? "Schreibe auf Deutsch" : `Schreibe auf ${L().name}`}</span>
        <span class="tag">${esc(PK(c.p).short)}${st==="nok" ? " · üben" : ""}</span>
      </div>
      <div class="say-line"><div class="q">${esc(q)}${c.g && dir==="fd" ? `<span class="g-badge">(${c.g})</span>` : ""}</div>${speakBtn(q, ql)}</div>
      <textarea class="write-in" id="writeIn" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"
        lang="${dir==="fd" ? "de" : FP.lang}" aria-label="Deine Übersetzung" placeholder="${dir==="fd" ? "Auf Deutsch …" : L().ph}" ${v ? "disabled" : ""}>${esc(round.typed)}</textarea>
      ${v ? `${fb}
        <div class="say-line"><div><div class="eyebrow" style="margin-bottom:2px">Lösung</div><div class="a">${esc(a)}${c.m ? '<span class="mk">grün</span>' : ""}</div></div>${speakBtn(a, al)}</div>
        ${c.ex ? `<div class="say-line"><div class="ex">${esc(c.ex)}</div>${speakBtn(c.ex, L().code)}</div>` : ""}` : ""}
    </div>
    ${v
      ? `<div class="btns">${v === "ok"
          ? `<span></span>`
          : `<button class="btn ghost" id="override">Doch richtig</button>`}
         <button class="btn" id="next">Weiter</button></div>`
      : `<button class="btn" id="check">Prüfen</button>
         ${dir==="df" && L().acc.length ? `<div class="row" id="accents" aria-label="Sonderzeichen">${L().acc.map(ch => `<button class="chip" data-ch="${ch}" style="padding:6px 11px">${ch}</button>`).join("")}</div>` : ""}`}
    <div class="row" style="justify-content:space-between">
      <span class="num">${round.i+1} / ${round.deck.length}</span>
      <button class="btn ghost" id="stop" style="padding:8px 14px">Runde beenden</button>
    </div>`;
  const inp = $("#writeIn");
  $("#stop").onclick = () => { round.deck = round.deck.slice(0, round.i); renderSummary(); };
  if (!v){
    inp.addEventListener("input", () => round.typed = inp.value);
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#check").click(); } });
    document.querySelectorAll("#accents [data-ch]").forEach(b => b.onclick = () => {
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + b.dataset.ch + inp.value.slice(en);
      round.typed = inp.value; inp.focus(); inp.setSelectionRange(s+1, s+1);
    });
    $("#check").onclick = () => {
      if (!inp.value.trim()){ inp.focus(); return; }
      round.typed = inp.value;
      round.verdict = checkWritten(inp.value, a);
      record(c, round.verdict === "ok" ? "ok" : "nok");
      renderCard();
    };
    inp.focus({preventScroll:true});
  } else {
    const ov = $("#override");
    if (ov) ov.onclick = () => { record(c, "ok"); round.verdict = "ok"; toast("Als richtig gezählt."); next(); };
    $("#next").onclick = next;
    $("#next").focus();
  }
  function next(){ round.i++; round.typed = ""; round.verdict = null; renderCard(); }
}
/* Gesprochene Antwort prüfen: Akzente zählen nicht (hört man nicht), die Erkennung
   liefert mehrere Vorschläge – passt einer, ist es richtig. Zusätzliche Wörter
   rundherum (z. B. Artikel) sind erlaubt. */
function judgeSpeech(alts, target){
  const opts = variants(target).map(cleanAns).map(stripAcc).filter(Boolean);
  for (const alt of alts){
    const h = stripAcc(cleanAns(alt));
    if (opts.includes(h)) return {ok:true, heard:alt};
    if (opts.some(o => o.length >= 3 && (" " + h + " ").includes(" " + o + " "))) return {ok:true, heard:alt};
  }
  return {ok:false, heard:alts[0] || ""};
}
const micIcon = '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';
function renderSpeakCard(c, dir, q, a, ql, al, st){
  const box = $("#play");
  const v = round.verdict;          // null | "ok" | "nok"
  const heard = round.heard || [];  // Vorschläge der Erkennung
  const recLang = dir === "fd" ? "de-DE" : L().code;
  const target = dir === "fd" ? "Deutsch" : L().name;
  box.innerHTML = `
    <div class="progress" aria-hidden="true"><i style="width:${round.i/round.deck.length*100}%"></i></div>
    <div class="card">
      <div class="card-head">
        <span class="eyebrow">Sag es auf ${esc(target)}</span>
        <span class="tag">${esc(PK(c.p).short)}${st==="nok" ? " · üben" : ""}</span>
      </div>
      <div class="say-line"><div class="q">${esc(q)}${c.g && dir==="fd" ? `<span class="g-badge">(${c.g})</span>` : ""}</div>${speakBtn(q, ql)}</div>
      ${!v ? `
        <button class="mic${round.listening ? " listening" : ""}" id="mic" aria-label="${round.listening ? "Hört zu" : "Antwort sprechen"}">${micIcon}</button>
        <div class="mic-hint" id="micHint">${round.listening ? "Ich höre zu … sprich jetzt." : esc(round.micMsg || "Tippe aufs Mikrofon und sag die Antwort.")}</div>` : `
        <div class="heard">Verstanden: <b>«${esc(round.matched || heard[0] || "")}»</b>
          ${heard.length > 1 ? `<small>Weitere Vorschläge: ${heard.filter(h => h !== round.matched).slice(0,3).map(h => "«" + esc(h) + "»").join(", ")}</small>` : ""}</div>
        <div class="feedback ${v === "ok" ? "ok" : "nok"}">${v === "ok" ? "Richtig!" : "Leider nicht ganz."}</div>
        <div class="say-line"><div><div class="eyebrow" style="margin-bottom:2px">Lösung</div><div class="a">${esc(a)}${c.m ? '<span class="mk">grün</span>' : ""}</div></div>${speakBtn(a, al)}</div>
        ${c.ex ? `<div class="say-line"><div class="ex">${esc(c.ex)}</div>${speakBtn(c.ex, L().code)}</div>` : ""}`}
    </div>
    ${v ? `<div class="btns">
        ${v === "ok" ? `<button class="btn ghost" id="again">Nochmals sprechen</button>` : `<button class="btn ghost" id="override">Doch richtig</button>`}
        <button class="btn" id="next">Weiter</button></div>
      ${v === "nok" ? `<button class="btn ghost" id="again">Nochmals sprechen</button>` : ""}`
      : `<button class="btn ghost" id="skip">Weiss ich nicht</button>`}
    <div class="row" style="justify-content:space-between">
      <span class="num">${round.i+1} / ${round.deck.length}</span>
      <button class="btn ghost" id="stop" style="padding:8px 14px">Runde beenden</button>
    </div>`;
  const stopRec = () => { try { round.rec && round.rec.abort(); } catch(e){} round.rec = null; round.listening = false; };
  const next = () => { stopRec(); round.i++; round.verdict = null; round.heard = []; round.matched = ""; round.micMsg = ""; renderCard(); };
  $("#stop").onclick = () => { stopRec(); round.deck = round.deck.slice(0, round.i); renderSummary(); };
  if (!v){
    $("#skip").onclick = () => { stopRec(); round.verdict = "nok"; round.heard = []; round.matched = "–"; record(c, "nok"); renderCard(); };
    $("#mic").onclick = () => {
      if (round.listening){ stopRec(); renderCard(); return; }
      let rec;
      try { rec = new SpeechRec(); } catch(e){ round.micMsg = "Spracherkennung ist auf diesem Gerät nicht verfügbar."; renderCard(); return; }
      rec.lang = recLang; rec.maxAlternatives = 5; rec.interimResults = false; rec.continuous = false;
      let got = false;
      rec.onresult = e => {
        got = true;
        const alts = Array.from(e.results[0]).map(r => r.transcript.trim()).filter(Boolean);
        const j = judgeSpeech(alts, a);
        round.heard = alts; round.matched = j.heard; round.verdict = j.ok ? "ok" : "nok";
        round.listening = false; round.rec = null;
        record(c, round.verdict);
        renderCard();
      };
      rec.onerror = e => {
        got = true; round.listening = false; round.rec = null;
        round.micMsg = ({
          "not-allowed": "Das Mikrofon ist nicht erlaubt. Bitte in Chrome für diese Seite das Mikrofon zulassen.",
          "service-not-allowed": "Das Mikrofon ist nicht erlaubt. Bitte in Chrome für diese Seite das Mikrofon zulassen.",
          "no-speech": "Nichts gehört. Tippe nochmals aufs Mikrofon und sprich deutlich.",
          "audio-capture": "Kein Mikrofon gefunden.",
          "network": "Für die Spracherkennung braucht es eine Internetverbindung.",
          "aborted": ""
        })[e.error] ?? "Das hat nicht geklappt. Bitte nochmals versuchen.";
        renderCard();
      };
      rec.onend = () => { if (!got){ round.listening = false; round.rec = null; round.micMsg = "Nichts gehört. Tippe nochmals aufs Mikrofon."; renderCard(); } };
      round.rec = rec; round.listening = true; round.micMsg = "";
      try { rec.start(); } catch(e){ round.listening = false; round.micMsg = "Das Mikrofon konnte nicht gestartet werden."; }
      renderCard();
    };
  } else {
    document.querySelectorAll("#again").forEach(b => b.onclick = () => { round.verdict = null; round.heard = []; round.matched = ""; round.micMsg = ""; renderCard(); });
    const ov = $("#override");
    if (ov) ov.onclick = () => { record(c, "ok"); toast("Als richtig gezählt."); next(); };
    $("#next").onclick = next;
    $("#next").focus();
  }
}
function record(c, r){
  round.res[c.id] = r; S.status[c.id] = r; save(); renderFix();
}
function answer(r){
  const {c} = round.deck[round.i];
  record(c, r);
  round.i++; round.shown = false;
  renderCard();
}
function renderSummary(){
  const ids = Object.keys(round.res);
  const ok = ids.filter(id => round.res[id]==="ok").length, nok = ids.length - ok;
  $("#play").innerHTML = `
    <h2>Runde fertig</h2>
    <div class="summary">
      <div class="stat"><b>${ok}</b>gewusst</div>
      <div class="stat n"><b>${nok}</b>nicht gewusst</div>
    </div>
    ${nok ? `<div class="empty" style="border-style:solid">${ids.filter(id=>round.res[id]==="nok").map(id => { const c = CARDS.find(x=>x.id===id); return `<div><b>${esc(text(c,"fr"))}</b> – ${esc(text(c,"de"))}</div>`; }).join("")}</div>` : ""}
    <div class="btns">
      <button class="btn ghost" id="back">Zur Auswahl</button>
      <button class="btn" id="again" ${nok ? "" : "disabled"}>Nicht gewusste üben</button>
    </div>`;
  $("#back").onclick = () => { $("#play").hidden = true; $("#setup").hidden = false; renderSetup(); };
  $("#again").onclick = () => { sel.onlyNok = true; renderSetup(); $("#start").click(); };
}

function scoreLine(res){
  const ok = res.filter(r => r==="ok").length, nok = res.filter(r => r==="nok").length;
  return `<div class="score" aria-live="polite"><span class="s-ok">${ok} richtig</span><span class="s-nok">${nok} falsch</span><span class="muted" style="padding-left:0">von ${res.length}</span></div>`;
}

/* Abschluss einer Lücken- oder m/f-Runde */
function roundSummary(box, res, label, onAll, onWrong){
  const keys = Object.keys(res);
  const ok = keys.filter(k => res[k]==="ok").length, nok = keys.length - ok;
  const msg = nok === 0 ? "Alles richtig, super!" : ok >= nok ? "Gut gemacht!" : "Weiter üben, das kommt!";
  box.innerHTML = `
    <h2>Runde fertig</h2>
    <p class="muted" style="margin:0">${msg}</p>
    <div class="summary">
      <div class="stat"><b>${ok}</b>richtig</div>
      <div class="stat n"><b>${nok}</b>falsch</div>
    </div>
    ${nok ? `<div class="empty" style="border-style:solid">${keys.filter(k => res[k]==="nok").map(label).join("")}</div>` : ""}
    <div class="btns">
      <button class="btn ghost" id="rAll">Neue Runde</button>
      <button class="btn" id="rWrong" ${nok ? "" : "disabled"}>Falsche nochmals</button>
    </div>`;
  box.querySelector("#rAll").onclick = onAll;
  box.querySelector("#rWrong").onclick = () => onWrong(keys.filter(k => res[k]==="nok"));
  box.querySelector(nok ? "#rWrong" : "#rAll").focus();
}

/* ---------- Lücken ---------- */
const newGapRound = (idx = fpGapIdx()) => ({order: shuffle([...idx]), i:0, done:false, res:{}});
let gap = newGapRound();
function renderGap(){
  const P = $("#p-gaps");
  if (gap.i >= gap.order.length){
    return roundSummary(P, gap.res,
      k => { const g = GAPS[k]; return `<div>${esc(g.pre)}<b>${esc(g.ans)}</b>${esc(g.post)}</div>`; },
      () => { gap = newGapRound(); renderGap(); },
      wrong => { gap = newGapRound(wrong.map(Number)); renderGap(); });
  }
  const gi = gap.order[gap.i];
  const g = GAPS[gi];
  P.innerHTML = `
    <p class="muted" style="margin:0">Setze das fehlende Wort ein. Die deutsche Übersetzung hilft dir.</p>
    ${scoreLine(fpGapIdx().map(i => S.gaps[i]))}
    <div class="card" style="min-height:0">
      <div class="card-head"><span class="eyebrow">Lückentext</span><span class="tag">${esc(PK(g.p).short)}</span></div>
      <div class="gap-sentence">${esc(g.pre)}<input class="gap-input" id="gapIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Fehlendes Wort">${esc(g.post)}</div>
      <div class="muted">${esc(g.hint)}</div>
      <div id="gapFb"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="gapTip">Tipp</button>
      <button class="btn" id="gapCheck">Prüfen</button>
    </div>
    <span class="num">${gap.i + 1} / ${gap.order.length}${gap.order.length < fpGapIdx().length ? " · nur falsche" : ""}</span>`;
  const inp = $("#gapIn");
  inp.addEventListener("keydown", e => { if (e.key==="Enter") $("#gapCheck").click(); });
  $("#gapTip").onclick = () => {
    $("#gapFb").innerHTML = `<div class="feedback warn">Es beginnt mit «${esc(g.ans[0])}» und hat ${g.ans.length} Buchstaben.</div>`;
  };
  $("#gapCheck").onclick = () => {
    if (gap.done){ gap.i++; gap.done=false; renderGap(); return; }
    const v = inp.value;
    if (!v.trim()){ inp.focus(); return; }
    const full = g.pre + g.ans + g.post;
    let fb;
    let r = "nok";
    if (norm(v) === norm(g.ans)) { r = "ok"; fb = `<div class="feedback ok">Richtig! ${esc(full)}</div>`; }
    else if (noAcc(v) === noAcc(g.ans)) fb = `<div class="feedback warn">Fast! Achte auf die Akzente: <b>${esc(g.ans)}</b></div>`;
    else fb = `<div class="feedback nok">Richtig wäre: <b>${esc(g.ans)}</b></div>`;
    S.gaps[gi] = r; gap.res[gi] = r; save(); renderFix();
    const sc = P.querySelector(".score"); if (sc) sc.outerHTML = scoreLine(fpGapIdx().map(i => S.gaps[i]));
    $("#gapFb").innerHTML = fb + `<div class="say-line" style="margin-top:10px;align-items:center"><div class="muted">${esc(full)}</div>${speakBtn(full, L().code)}</div>`;
    inp.disabled = true; gap.done = true;
    $("#gapCheck").textContent = gap.i + 1 >= gap.order.length ? "Auswertung" : "Weiter"; $("#gapCheck").focus();
  };
  inp.focus({preventScroll:true});
}

/* ---------- Genus ---------- */
const newGenRound = (idx = fpGenusIdx()) => ({order: shuffle([...idx]), i:0, done:false, res:{}});
let gen = newGenRound();
function art(x){
  const vowel = /^[aeiouh]/.test(x.w);
  if (x.g==="m/f") return `${vowel?"l'":"le/la "}${x.w} · un/une ${x.w}`;
  if (x.g==="m") return `${vowel?"l'":"le "}${x.w} · un ${x.w}`;
  return `${vowel?"l'":"la "}${x.w} · une ${x.w}`;
}
function renderGenus(){
  const P = $("#p-genus");
  if (gen.i >= gen.order.length){
    return roundSummary(P, gen.res,
      k => { const y = GENUS.find(z => z.w === k); return `<div><b>${esc(art(y).split(" · ")[0])}</b> – ${esc(y.de)}</div>`; },
      () => { gen = newGenRound(); renderGenus(); },
      wrong => { gen = newGenRound(wrong.map(w => GENUS.findIndex(z => z.w === w))); renderGenus(); });
  }
  const x = GENUS[gen.order[gen.i]];
  P.innerHTML = `
    ${scoreLine(GENUS.filter(inFp).map(y => S.genus[y.w]))}
    <p class="muted" style="margin:0">Männlich oder weiblich? Auf dem Blatt stehen (m) und (f) bei einigen Wörtern, die übrigen Nomen stammen aus den Sätzen.</p>
    <div class="card" style="min-height:0">
      <div class="card-head"><span class="eyebrow">Genus</span><span class="tag">${x.src}</span></div>
      <div class="say-line"><div><div class="q">${esc(x.w)}</div><div class="muted">${esc(x.de)}</div></div>${speakBtn(x.w,"fr-FR")}</div>
      <div id="genFb"></div>
    </div>
    <div class="genus-btns" id="genBtns">
      <button data-g="m">männlich<small>le / un</small></button>
      <button data-g="f">weiblich<small>la / une</small></button>
      <button data-g="m/f">beides<small>le/la</small></button>
    </div>
    <div class="row" style="justify-content:space-between">
      <span class="num">${gen.i + 1} / ${gen.order.length}${gen.order.length < fpGenusIdx().length ? " · nur falsche" : ""}</span>
      <button class="btn" id="genNext" disabled style="padding:8px 16px">Weiter</button>
    </div>`;
  document.querySelectorAll("#genBtns button").forEach(b => b.onclick = () => {
    if (gen.done) return;
    gen.done = true;
    const right = b.dataset.g === x.g;
    S.genus[x.w] = right ? "ok" : "nok"; gen.res[x.w] = S.genus[x.w]; save(); renderFix();
    const sc = P.querySelector(".score"); if (sc) sc.outerHTML = scoreLine(GENUS.filter(inFp).map(y => S.genus[y.w]));
    document.querySelectorAll("#genBtns button").forEach(o => { if (o.dataset.g===x.g) o.classList.add("right"); });
    if (!right) b.classList.add("wrong");
    const a = art(x);
    $("#genFb").innerHTML = `<div class="feedback ${right?"ok":"nok"}">${right?"Richtig!":"Nicht ganz."} ${esc(a)}</div>`;
    say(a.split(" · ")[0].replace("/"," ou "), "fr-FR");
    if (gen.i + 1 >= gen.order.length) $("#genNext").textContent = "Auswertung";
    $("#genNext").disabled = false; $("#genNext").focus();
  });
  $("#genNext").onclick = () => { gen.i++; gen.done=false; renderGenus(); };
}

/* ---------- Blatt (Erkennung + Korrekturen) ---------- */
function renderSheet(){
  const P = $("#p-sheet");
  const n = CARDS.filter(inFp).length;
  P.innerHTML = `
    <div class="note">
      <b>So hat die App das Foto gelesen</b>
      <ul>
        <li>${L().name}- und Deutsch-Spalte wurden Zeile für Zeile zu ${n} Paaren verbunden.</li>
        ${FP.sheet.map(t => `<li>${esc(t)}</li>`).join("")}
      </ul>
    </div>
    ${FP.packs.map(p => `
      <div class="pack">
        <div class="pack-h"><h3>${esc(PK(p).title)}</h3><span class="eyebrow">${esc(PK(p).sub)}</span></div>
        ${CARDS.filter(c => c.p===p).map(c => {
          const f = FIXES.find(x => x.card===c.id);
          const kept = f && S.fixes[f.id]==="orig";
          return `<div class="pair${f?" flag":""}${c.m?" marked":""}">
            <div>${esc(text(c,"fr"))}${c.g?`<span class="g-badge">(${c.g})</span>`:""}${c.m?'<span class="mk">grün</span>':""}</div>
            <div>${esc(text(c,"de"))}</div>
            ${c.ex ? `<div class="ex">${esc(c.ex)}</div>` : ""}
            ${f ? `<div class="fixbox">
              <div>Auf dem Blatt: <s>${esc(f.orig)}</s><br>Vorschlag: <ins>${esc(c[f.field])}</ins></div>
              <div class="muted">${esc(f.why)}</div>
              <div class="seg" role="group" aria-label="Korrektur">
                <button data-fix="${f.id}" data-v="fix" aria-pressed="${!kept}">Korrektur lernen</button>
                <button data-fix="${f.id}" data-v="orig" aria-pressed="${kept}">Wie auf dem Blatt</button>
              </div></div>` : ""}
          </div>`;
        }).join("")}
      </div>`).join("")}
    ${FP.date ? `<p class="muted" style="margin:0;font-size:.85rem">${esc(FP.name)} am ${FP.date.toLocaleDateString("de-CH")} wurde vom Blatt übernommen.</p>` : ""}`;
  document.querySelectorAll("[data-fix]").forEach(b => b.onclick = () => {
    S.fixes[b.dataset.fix] = b.dataset.v; save(); renderSheet();
    toast(b.dataset.v==="fix" ? "Korrigierte Version wird geübt." : "Version vom Blatt wird geübt.");
  });
}

/* ---------- Profilauswahl ---------- */
function renderProfiles(){
  $("#profiles").innerHTML = P.list.map(n =>
    `<button class="chip" data-profile="${esc(n)}" aria-pressed="${n===P.current}">${esc(n)}</button>`).join("")
    + (P.list.length ? `<button class="chip add-chip" id="addProfile" aria-label="Profil hinzufügen">+ Profil</button>` : "");
  document.querySelectorAll("[data-profile]").forEach(b => b.onclick = () => switchProfile(b.dataset.profile));
  const add = $("#addProfile");
  if (add) add.onclick = () => showWelcome(true);
}
function showWelcome(cancelable){
  $("#welcome").hidden = false; $("#app").hidden = true;
  $("#cancelAdd").hidden = !cancelable;
  $("#nameInput").value = ""; $("#nameInput").focus();
}
function switchProfile(name){
  P.current = name; saveProfiles();
  loadState();
  FP = FIXPUNKTE.find(f => f.id === S.fp) || defaultFp("fr");
  if (FP.date && FP.date < today0()) FP = defaultFp(FP.lang); // vergangener Fixpunkt -> nächster
  sel = newSel();
  round = null; gap = newGapRound(); gen = newGenRound();
  $("#welcome").hidden = true; $("#app").hidden = false;
  $("#play").hidden = true; $("#setup").hidden = false;
  renderProfiles(); renderFix(); renderSetup();
  document.querySelector('.tabs button[data-tab="cards"]').click();
}
function setFp(id){
  FP = FIXPUNKTE.find(f => f.id === id) || defaultFp();
  S.fp = FP.id; S.fpLang = Object.assign(S.fpLang || {}, {[FP.lang]: FP.id}); save();
  sel = newSel(); round = null; gap = newGapRound(); gen = newGenRound();
  $("#play").hidden = true; $("#setup").hidden = false;
  renderFix(); renderSetup();
  const active = document.querySelector('.tabs button[aria-selected="true"]');
  (active && !active.hidden ? active : document.querySelector('.tabs button[data-tab="cards"]')).click();
}
function setLang(lang){
  const remembered = FIXPUNKTE.find(f => f.id === (S.fpLang || {})[lang]);
  const pick = remembered && !(remembered.date && remembered.date < today0()) ? remembered : defaultFp(lang);
  setFp(pick.id);
}
document.querySelectorAll("#langSeg [data-lang]").forEach(b => b.onclick = () => { if (b.dataset.lang !== FP.lang) setLang(b.dataset.lang); });
$("#nameForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#nameInput").value.trim().slice(0, 20);
  if (!name){ $("#nameInput").focus(); return; }
  if (!P.list.includes(name)) P.list.push(name);
  switchProfile(name);
});
$("#cancelAdd").onclick = () => { $("#welcome").hidden = true; $("#app").hidden = false; };

/* ---------- boot ---------- */
try { speechSynthesis.getVoices(); } catch(e){}
if (P.current && P.list.includes(P.current)) switchProfile(P.current);
else { renderProfiles(); showWelcome(false); }

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
</body>
</html>
